[package]
name = "mediaorganizer"
version = "0.0.1"
description = "Local media library desktop shell"
authors = ["MediaOrganizer"]
edition = "2021"

[lib]
name = "mediaorganizer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
